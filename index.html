<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>GES 104 CBT Practice</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6f3;--card:#fff;--tx:#1a2a1f;--mu:#5d6b61;--ac:#1f7a4d;--ac2:#e6f3ec;--bd:#d5ddd6;--ok:#1f7a4d;--no:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--card:#1b261f;--tx:#e8efe9;--mu:#93a398;--ac:#4cc58a;--ac2:#1f3a2b;--bd:#2f4136;--ok:#4cc58a;--no:#ff7a6b}}
:root[data-theme="dark"]{--bg:#121a15;--card:#1b261f;--tx:#e8efe9;--mu:#93a398;--ac:#4cc58a;--ac2:#1f3a2b;--bd:#2f4136;--ok:#4cc58a;--no:#ff7a6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:14px}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.15rem;margin:0 0 10px}.m{color:var(--mu);font-size:.9rem}
input{width:100%;padding:12px;margin:6px 0 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 18px;background:var(--ac);color:#fff;font-weight:600}
button.g{background:var(--ac2);color:var(--ac)}button:disabled{opacity:.4}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.t{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ac)}
.o{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:1.5px solid var(--bd);margin:8px 0;font-weight:400}
.o.s{border-color:var(--ac);background:var(--ac2)}
.o.ok{border-color:var(--ok);background:var(--ac2)}.o.no{border-color:var(--no)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.gr{display:flex;flex-wrap:wrap;gap:6px}.gr button{width:38px;height:38px;padding:0;background:var(--bg);color:var(--tx);border:1.5px solid var(--bd);font-size:.85rem}
.gr button.d{background:var(--ac);color:#fff;border-color:var(--ac)}.gr button.cur{outline:2px solid var(--tx)}
.big{font-size:2.6rem;font-weight:800;color:var(--ac)}
.rv{border-left:4px solid var(--ok);padding-left:12px;margin:14px 0}.rv.x{border-color:var(--no)}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}
.tw{overflow-x:auto}.hide{display:none}.err{color:var(--no);font-size:.9rem}
</style></head><body><div class="w" id="app"></div>
<footer class="m" style="text-align:center;padding:4px 16px 24px">© 2026 · Built by <a href="https://www.linkedin.com/in/honajibola/" target="_blank" rel="noopener noreferrer"><b>Ajibola Idowu-Praise [HON. AJIBOLA]</b></a> · <a href="https://wa.me/2349050704741" target="_blank" rel="noopener noreferrer">Contact him here</a></footer>
<script src="questions.js"></script>
<script>
const Q=(RAW+"\n"+NEW).split("\n").map(l=>{const p=l.split("|");return{q:p[0],o:p.slice(1,5),a:"ABCD".indexOf(p[5])}});
const N=30,MINS=30,L="ABCD",$=id=>document.getElementById(id),app=$("app");
let S={},tm=null;
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function home(){S.home=1;app.innerHTML=`<div class="c"><h1>GES 104 CBT Practice</h1><p class="m">Science, Industry and Mankind · University of Ibadan</p>
<p>${N} random questions · ${MINS} minutes · answers revealed at the end.</p>
<label>Full name<input id="nm" autocomplete="name"></label><label>Matric number<input id="mt" inputmode="text"></label>
<div class="err" id="er"></div><button id="go">Start test</button></div>
<p class="m" style="text-align:center"><a href="#" id="adm"  style="color:var(--mu)">Admin</a></p>`;
$("go").onclick=()=>{const n=$("nm").value.trim(),m=$("mt").value.trim();if(n.length<3||m.length<4){$("er").textContent="Please enter your full name and matric number.";return}start(n,m)};
$("adm").onclick=e=>{e.preventDefault();admin()}}
function start(n,m){S={n,m,qs:sh(Q).slice(0,N).map(q=>{if(/above|only/i.test(q.o.join()))return q;const o=sh(q.o.map((t,i)=>[t,i]));return{q:q.q,o:o.map(x=>x[0]),a:o.findIndex(x=>x[1]==q.a)}}),ans:Array(N).fill(-1),i:0,end:Date.now()+MINS*6e4};clearInterval(tm);tm=setInterval(tick,1000);exam()}
function tick(){const r=Math.max(0,Math.round((S.end-Date.now())/1e3)),e=$("tm");if(e)e.textContent=String(Math.floor(r/60)).padStart(2,"0")+":"+String(r%60).padStart(2,"0");if(r<=0)finish()}
function exam(){const q=S.qs[S.i],done=S.ans.filter(x=>x>=0).length;
app.innerHTML=`<div class="c"><div class="top"><b>${esc(S.n)}</b><span class="t" id="tm"></span></div></div>
<div class="c"><div class="m">Question ${S.i+1} of ${N}</div><h2>${esc(q.q)}</h2>${q.o.map((o,k)=>`<button class="o ${S.ans[S.i]==k?'s':''}" data-k="${k}"><b>${L[k]}.</b> ${esc(o)}</button>`).join("")}
<div class="nav"><button class="g" id="pv" ${S.i?'':'disabled'}>Previous</button>${S.i<N-1?'<button id="nx">Next</button>':'<button id="sb">Submit</button>'}</div></div>
<div class="c"><div class="m" style="margin-bottom:8px">${done}/${N} answered</div><div class="gr">${S.qs.map((_,k)=>`<button data-j="${k}" class="${S.ans[k]>=0?'d':''} ${k==S.i?'cur':''}">${k+1}</button>`).join("")}</div><br><button class="g" id="fin">Submit test</button></div>`;
tick();document.querySelectorAll(".o").forEach(b=>b.onclick=()=>{S.ans[S.i]=+b.dataset.k;exam()});
document.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{S.i=+b.dataset.j;exam()});
$("pv").onclick=()=>{S.i--;exam()};if($("nx"))$("nx").onclick=()=>{S.i++;exam()};
const f=()=>{const u=S.ans.filter(x=>x<0).length;if(!u||confirm(u+" question(s) unanswered. Submit anyway?"))finish()};$("fin").onclick=f;if($("sb"))$("sb").onclick=f}
async function finish(){clearInterval(tm);if(S.done)return;S.done=1;const sc=S.qs.reduce((s,q,k)=>s+(S.ans[k]==q.a?1:0),0);S.sc=sc;let saved=false;
try{const r=await fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:S.n,matric:S.m,score:sc,total:N})});saved=r.ok}catch(e){}
const pc=Math.round(sc/N*100);
app.innerHTML=`<div class="c" style="text-align:center"><div class="m">${esc(S.n)} · ${esc(S.m)}</div><div class="big">${sc}/${N}</div><div>${pc}% — ${pc>=70?"Excellent!":pc>=50?"Good effort, keep practising.":"Keep studying and try again."}</div>
<p class="m">${saved?"Your score has been recorded.":"Score could not be recorded online."}</p><button id="re">Try again</button></div>
${S.qs.map((q,k)=>{const a=S.ans[k],ok=a==q.a;return`<div class="c rv ${ok?'':'x'}"><div class="m">Question ${k+1} · ${ok?"Correct ✓":a<0?"Not answered ✗":"Wrong ✗"}</div><b>${esc(q.q)}</b>${q.o.map((o,j)=>`<div class="o ${j==q.a?'ok':j==a?'no':''}" style="padding:8px 12px;border-radius:10px;margin:6px 0;border:1.5px solid var(--bd)"><b>${L[j]}.</b> ${esc(o)}${j==q.a?" ✓":j==a?" (your answer)":""}</div>`).join("")}</div>`}).join("")}`;
$("re").onclick=()=>{S={};home()};window.scrollTo(0,0)}
function admin(){const pw=prompt("Admin password");if(!pw)return;
app.innerHTML=`<div class="c"><div class="top"><h2>Admin · Results</h2><span><button class="g" id="csv">CSV</button> <button class="g" id="bk">Back</button></span></div><input id="sr" placeholder="Search name or matric"><div class="m" id="st">Loading…</div><div class="tw"><table><thead><tr><th>#</th><th>Name</th><th>Matric</th><th>Score</th><th>Date</th></tr></thead><tbody id="tb"></tbody></table></div></div>`;
$("bk").onclick=()=>{S={};home()};let rows=[],r=[];
const draw=()=>{const f=$("sr").value.toLowerCase();r=rows.filter(x=>(x.name+x.matric).toLowerCase().includes(f));const tb=$("tb");tb.textContent="";
r.forEach((x,i)=>{const tr=tb.insertRow();[i+1,x.name,x.matric,x.score+"/"+x.total,new Date(x.created_at).toLocaleString()].forEach(v=>tr.insertCell().textContent=v)});
$("st").textContent=r.length+" attempt(s)"+(r.length?" · average "+(r.reduce((s,x)=>s+x.score,0)/r.length).toFixed(1)+"/"+N:"")};
$("sr").oninput=draw;
$("csv").onclick=()=>{const c=["Name,Matric,Score,Total,Date"].concat(r.map(x=>[x.name,x.matric,x.score,x.total,x.created_at].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(","))).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));a.download="ges104-results.csv";a.click()};
fetch("/api/results",{headers:{"x-admin-password":pw}}).then(async x=>{if(!x.ok){const j=await x.json().catch(()=>({}));throw x.status+" "+(j.error||"")+" "+(j.detail||"")}rows=await x.json();draw()}).catch(e=>{$("st").textContent="Error: "+e})}
home();
</script></body></html>
